<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Leetbot Data Explorer</title>
  <meta name="title" content="Leetbot Data Explorer" />
  <meta name="description" content="See the LeetCode problems that have been asked at tech companies around the world." />
  <meta name="keywords"
    content="leetcode, coding interview, data analytics, programming problems, algorithm practice, coding statistics, leetbot, leetbot.org" />
  <meta name="author" content="Leetbot" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://leetbot.org" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://leetbot.org" />
  <meta property="og:title" content="Leetbot Data Explorer" />
  <meta property="og:description"
    content="See the LeetCode problems that have been asked at tech companies around the world." />
  <meta property="og:image" content="https://leetbot.org/og.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Leetbot" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://leetbot.org" />
  <meta property="twitter:title" content="Leetbot Data Explorer" />
  <meta property="twitter:description"
    content="See the LeetCode problems that have been asked at tech companies around the world." />
  <meta property="twitter:image" content="https://leetbot.org/og.webp" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="msapplication-TileColor" content="#0f172a" />
  <meta name="application-name" content="Leetbot Data Explorer" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Leetbot.org",
      "description": "See the LeetCode problems that have been asked at tech companies around the world.",
      "url": "https://leetbot.org",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Leetbot"
      }
    }
    </script>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'dark' || stored === 'light' ? stored :
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.className += ' ' + theme;
      } catch (e) {
        document.documentElement.className += ' light';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
