- name: update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

# docker - official install (correct + idempotent)

- name: install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: install docker gpg key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: convert docker gpg key to binary
  command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: add docker apt repository
  apt_repository:
    repo: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present

- name: install docker engine and compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: ensure containerd is running
  systemd:
    name: containerd
    enabled: yes
    state: started

- name: ensure docker is running
  systemd:
    name: docker
    enabled: yes
    state: started

- name: add user to docker group
  user:
    name: whotypes
    groups: docker
    append: yes

# security packages

- name: install security tools
  apt:
    name:
      - ufw
      - fail2ban
    state: present

# firewall (deterministic, no leftover state)

- name: reset ufw to clean state
  ufw:
    state: reset

- name: set default deny incoming
  ufw:
    policy: deny
    direction: incoming

- name: set default allow outgoing
  ufw:
    policy: allow
    direction: outgoing

- name: allow ssh
  ufw:
    rule: allow
    port: "22"

- name: allow http
  ufw:
    rule: allow
    port: "80"

- name: allow https
  ufw:
    rule: allow
    port: "443"

- name: enable ufw
  ufw:
    state: enabled

# ssh hardening (safe + idempotent)

- name: disable root ssh login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    create: yes
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

- name: disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    create: yes
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

# fail2ban

- name: ensure fail2ban is enabled
  systemd:
    name: fail2ban
    enabled: yes
    state: started