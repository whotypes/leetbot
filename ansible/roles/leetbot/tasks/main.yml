- name: create dir
  file:
    path: "{{ leetbot_install_dir }}"
    state: directory

- name: clone repo
  git:
    repo: "{{ leetbot_repo_url }}"
    dest: "{{ leetbot_install_dir }}"
    version: "{{ leetbot_repo_version }}"
  register: repo

- name: env file
  template:
    src: .env.j2
    dest: "{{ leetbot_install_dir }}/.env"

- name: compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ leetbot_install_dir }}/docker-compose.yml"

- name: run compose
  community.docker.docker_compose_v2:
    project_src: "{{ leetbot_install_dir }}"
    state: present
    build: "{{ 'always' if repo.changed else 'policy' }}"